name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint / Typecheck / Unit tests / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - name: Build
        run: npm run build
        env:
          # ビルド時にサーバーアクション/GAS呼び出しが実行されるわけではないが、
          # 環境変数読み込み処理自体はモジュール評価時に走るためダミー値を与える。
          GAS_API_URL: https://example.com/exec
          APP_PASSCODE: "0000"

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
